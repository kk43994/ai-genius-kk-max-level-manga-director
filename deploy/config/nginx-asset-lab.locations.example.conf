# EXAMPLE ONLY. Include inside the existing kk666.best HTTPS server after review.
# Do NOT replace its listen/TLS/stream blocks. No root /api or wildcard route.
# Assumes the integrated app on 127.0.0.1:18769 serves root /api/v1 and root UI.
# publicBasePath=/asset-lab/ ; apiBase=/asset-lab/api/v1 .
# Preserve these paths when rendering frontend HTML and provider return paths.
location = /asset-lab { return 308 /asset-lab/; }

# ONLY immutable public code, never release metadata/server/data/private files.
location ~ ^/asset-lab/releases/(?<asset_lab_release_id>[A-Za-z0-9._+-]+)/(?<asset_lab_public_path>.*)$ {
    alias /srv/asset-lab-customer/runtime/releases/$asset_lab_release_id/public/$asset_lab_public_path;
    # This host did not map .mjs at inspection time. Keep the standard MIME
    # table and add modules locally without changing other sites.
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

# Avoid ^~ here: it would prevent the immutable version-path regex above.
location /asset-lab/ {
    proxy_pass http://127.0.0.1:18769/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /asset-lab;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    # HTML and version responses are never cached. The app also sends no-store.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
