name: Verify creator workflow
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/query_project_knowledge.py --check
      - run: python scripts/check_all.py --output /tmp/manju-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: /tmp/manju-checks.json
